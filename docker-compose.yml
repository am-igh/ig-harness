# IG Harness: UI + API + worker. Ollama runs natively on the Mac, not here.
#
# Network design: api and worker sit on an internal network with NO internet access.
# Only the ui container (Vite dev server) is also on the edge network so the browser
# can reach it at http://localhost:5173; it forwards /api calls to the api.
# Phase 2 will add the allow-listed routes for the model gateway and Google connectors.
services:
  api:
    build: { context: ., dockerfile: harness/Dockerfile }
    command: uvicorn harness.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      IG_DATA_DIR: /data
      OLLAMA_URL: http://ollama.internal:11434
      IG_LOCAL_MODEL: ${IG_LOCAL_MODEL:-qwen3:8b}
    volumes:
      - ${HOME}/IG-Harness-data:/data
      - ./harness:/app/harness
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./tools:/app/tools
      # read-only, so the static no-send scans in tests/ can see every part of the code base
      - ./worker:/app/worker:ro
      - ./scripts:/app/scripts:ro
      - ./ui/src:/app/ui/src:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro      # so a test can check what is mounted
      # Her spreadsheets, mounted READ-ONLY. Paths come from .env (see .env.example).
      - ${SUIVI_DIR:-./tests/fixtures/suivi}:/sources/suivi:ro
      - ${PROJETS_DIR:-./tests/fixtures/projets}:/sources/projets:ro
      # The Scan-Inbox folder Image Capture saves into, READ-ONLY: the harness looks at scans, it never changes or deletes them.
      - ${SCAN_INBOX_DIR:-./tests/fixtures/scan}:/sources/scan:ro
      # Audit: ONLY the 2026 year folder and the Outils folder (the checker script), read-only. Contracts and salary slips in other years stay unmounted.
      - ${AUDIT_YEAR_DIR:-./tests/fixtures/audit/2026}:/sources/audit/2026:ro
      - ${AUDIT_TOOLS_DIR:-./tests/fixtures/audit/Outils}:/sources/audit/Outils:ro
    networks: [backend, ollama_net]

  ollama-bridge:
    image: nginx:alpine
    volumes:
      - ./docker/ollama-bridge.conf:/etc/nginx/nginx.conf:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks:
      ollama_net: { aliases: [ollama.internal] }   # Ollama only accepts *.internal host names
      edge: {}

  worker:
    build: { context: ., dockerfile: harness/Dockerfile }
    command: python -m worker.main
    environment: { IG_DATA_DIR: /data }
    volumes:
      - ${HOME}/IG-Harness-data:/data
      - ./harness:/app/harness
      - ./worker:/app/worker
    networks: [backend]

  # Self-hosted web search for the chat's Research mode. It is the ONLY service with internet access besides the UI's edge network, so it is kept on its own network (search_net):
  # the api and worker are not on it and cannot reach it. Only the Mac-side research helper talks to it, at 127.0.0.1:8888. It is not started by `make up`; use `make searxng-up`.
  searxng:
    image: searxng/searxng:latest
    profiles: ["research"]
    ports: ["127.0.0.1:8888:8080"]
    volumes:
      - ${HOME}/IG-Harness-data/searxng:/etc/searxng
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    restart: unless-stopped
    networks: [search_net]

  ui:
    build: { context: ./ui }
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    depends_on: [api]
    networks: [backend, edge]

networks:
  backend: { internal: true }
  ollama_net: { internal: true }   # only the API (gateway) and the Ollama forwarder
  edge: {}
  search_net: {}                   # internet for the search engine only; nothing of the harness is on it

volumes:
  ui_node_modules:

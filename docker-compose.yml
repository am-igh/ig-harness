# IG Harness: UI + API + worker. Ollama runs natively on the Mac, not here.
#
# Network design: api and worker sit on an internal network with NO internet access.
# Only the ui container (Vite dev server) is also on the edge network so the browser
# can reach it at http://localhost:5173; it forwards /api calls to the api.
# Phase 2 will add the allow-listed routes for the model gateway and Google connectors.
services:
  api:
    build: { context: ., dockerfile: harness/Dockerfile }
    command: uvicorn harness.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      IG_DATA_DIR: /data
      OLLAMA_URL: http://ollama.internal:11434
      IG_LOCAL_MODEL: ${IG_LOCAL_MODEL:-qwen3:8b}
    volumes:
      - ${HOME}/IG-Harness-data:/data
      - ./harness:/app/harness
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./tools:/app/tools
      # Her spreadsheets, mounted READ-ONLY. Paths come from .env (see .env.example).
      - ${SUIVI_DIR:-./tests/fixtures/suivi}:/sources/suivi:ro
      - ${PROJETS_DIR:-./tests/fixtures/projets}:/sources/projets:ro
    networks: [backend, ollama_net]

  ollama-bridge:
    image: nginx:alpine
    volumes:
      - ./docker/ollama-bridge.conf:/etc/nginx/nginx.conf:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks:
      ollama_net: { aliases: [ollama.internal] }   # Ollama only accepts *.internal host names
      edge: {}

  worker:
    build: { context: ., dockerfile: harness/Dockerfile }
    command: python -m worker.main
    environment: { IG_DATA_DIR: /data }
    volumes:
      - ${HOME}/IG-Harness-data:/data
      - ./harness:/app/harness
      - ./worker:/app/worker
    networks: [backend]

  ui:
    build: { context: ./ui }
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    depends_on: [api]
    networks: [backend, edge]

networks:
  backend: { internal: true }
  ollama_net: { internal: true }   # only the API (gateway) and the Ollama forwarder
  edge: {}

volumes:
  ui_node_modules:
